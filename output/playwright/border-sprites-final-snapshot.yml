    - tabpanel "MCI":
      - img "mci-phase-0.png, MCI alternating frames preview, two 160 by 200 double-width frames, 368 by 272 including border sprites": Your resized image appears here.
      - text: 84% 2 × 160 × 200 logical pixels · 368 × 272 with borders
      - region "MCI frames":
        - heading "MCI frames" [level=3]
        - figure "Frame 1 160 × 200":
          - text: Frame 1 160 × 200
          - img "mci-phase-0.png, MCI frame 1, 160 by 200 double-width pixels": IFLI frame 1 appears here.
        - figure "Frame 2 160 × 200":
          - text: Frame 2 160 × 200
          - img "mci-phase-0.png, MCI frame 2, 160 by 200 double-width pixels": IFLI frame 2 appears here.
        - figure "Column merge 320 × 200 · square pixels":
          - text: Column merge 320 × 200 · square pixels
          - img "mci-phase-0.png, 320 by 200 column merge, even columns from frame 1 and odd columns from frame 2": The merged IFLI image appears here.
        - figure "50/50 blend 320 × 200 · square pixels":
          - text: 50/50 blend 320 × 200 · square pixels
          - img "mci-phase-0.png, 320 by 200 50/50 blend, frame 2 shifted one hires pixel right": The blended IFLI image appears here.
