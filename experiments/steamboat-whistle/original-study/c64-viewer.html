<style>

*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:30px 20px}

<main>
<h1>Musse på C64</h1>
<p>Inspelat från VICE med C64:ans samplade SID-ljud. Animationen använder 256 tecken och går i 10 fps.</p>
<video id="movie" src="c64-original.mp4" poster="c64-original-poster.png" controls playsinline preload="auto"></video>
<div class="actions"><button id="play" type="button">Spela från början med ljud</button><a href="c64-original-player.prg" download>Hämta C64-programmet</a></div>
<p class="note">Originalfilmens sekvens 32–38 sekunder. Bilden visar den riktiga C64-uppspelningen, inklusive övergångar medan tecknen ritas.</p>
</main>
<script>
const movie=document.getElementById('movie');
document.getElementById('play').addEventListener('click',()=>{
  movie.currentTime=0;
  movie.muted=false;
  movie.play().catch(()=>{});
});
</script>
